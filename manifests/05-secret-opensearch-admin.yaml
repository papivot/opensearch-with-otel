# The ONE static credential this stack needs. No templating, no script generates
# this -- it is a plain, committed value. CHANGE IT before anything but a throwaway demo.
#
# Must satisfy OpenSearch's PasswordValidator: >= 8 chars, at least one uppercase,
# one lowercase, one digit, one special character, and it must pass a zxcvbn strength
# check -- a weak value makes the OpenSearch container exit during demo-config install.
#
# Consumers of `admin-password` (keep them all in sync if you change it):
#   - manifests/06-hr-opensearch.yaml            extraEnvs.OPENSEARCH_INITIAL_ADMIN_PASSWORD
#                                                 (secretKeyRef -- reads live)
#   - manifests/10-bootstrap-job.yaml            OS_PASSWORD env (secretKeyRef -- reads live)
#   - manifests/08-hr-data-prepper.yaml          wait-for-bootstrap initContainer's
#                                                 OS_PASSWORD env (secretKeyRef -- reads live)
#   - manifests/08-hr-data-prepper.yaml          every pipeline sink's `password:` field --
#                                                 DUPLICATED AS A LITERAL STRING, because
#                                                 Data Prepper's pipelineConfig.config is
#                                                 native Helm values, not env-substituted.
#                                                 Data Prepper authenticates to OpenSearch
#                                                 as `admin` in this stage-1 design (no
#                                                 separate ingest user) -- keep that literal
#                                                 in sync with this value by hand.
#   - scripts/verify.sh, import-dashboards.sh,
#     export-dashboards.sh                       read this Secret live via kubectl; never
#                                                 hardcode the password in a script.
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-bootstrap
  namespace: observability
type: Opaque
stringData:
  admin-password: "YdYPd6FoPTlN7lun4KPcn3If#7Kx!"
