# Per-node agent collector. Its only job is Kubernetes container logs: it tails
# /var/log/pods on every node, which is the one task that genuinely needs a DaemonSet.
# Managed by the OpenTelemetry Operator (see manifests/02-hr-otel-operator.yaml) via an
# OpenTelemetryCollector CR.
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent
  namespace: observability
---
# The k8s_attributes processor's `pod_association`/`filter` lookups need to read pod,
# namespace and replicaset metadata from the API server. The operator does not
# auto-generate this RBAC (manager.createRbacPermissions: false); rules below are pulled
# from the opentelemetry-collector chart's own clusterrole.yaml template so they match
# exactly what its kubernetesAttributes preset granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-agent
subjects:
  - kind: ServiceAccount
    name: otel-agent
    namespace: observability
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: observability
spec:
  mode: daemonset
  serviceAccount: otel-agent

  # Same distro/version as the gateway -- see that CR for why. Contains filelogreceiver,
  # k8sattributesprocessor and extension/storage/filestorage, which is everything the
  # presets used to inject.
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s:0.159.0

  resources:
    requests:
      cpu: "100m"
      memory: "192Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  securityContext:
    runAsUser: 0
    runAsGroup: 0

  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    # health_check's endpoint below references it; the operator does not auto-inject
    # MY_POD_IP the way the Helm chart did.
    - name: MY_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP

  # hostPath mounts the logsCollection preset used to create. varlibdockercontainers is
  # carried over for fidelity with the chart's default even though this cluster's
  # runtime is containerd, not dockershim -- a non-existent hostPath source just mounts
  # an empty directory, so it is harmless cargo.
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers
    - name: varlibotelcol
      hostPath:
        path: /var/lib/otelcol
        type: DirectoryOrCreate
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true
    - name: varlibotelcol
      mountPath: /var/lib/otelcol

  # Nothing should reach this collector from outside; it only tails files. No `ports`
  # declared at all -- matches the "nothing reaches this collector" design from before.
  config:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      # Checkpoint storage so a restart doesn't replay every log file.
      file_storage:
        directory: /var/lib/otelcol

    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/observability_otel-agent*_*/opentelemetry-collector/*.log]
        start_at: end
        retry_on_failure:
          enabled: true
        storage: file_storage
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
            max_log_size: 102400

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        timeout: 5s
        send_batch_size: 1024

      k8s_attributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.replicaset.uid
            - k8s.daemonset.name
            - k8s.daemonset.uid
            - k8s.job.name
            - k8s.job.uid
            - k8s.container.name
            - k8s.cronjob.name
            - k8s.statefulset.name
            - k8s.statefulset.uid
            - container.image.tag
            - container.image.name
            - k8s.cluster.uid
            - service.namespace
            - service.name
            - service.version
            - service.instance.id
          otel_annotations: true
        filter:
          node_from_env_var: K8S_NODE_NAME
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

    exporters:
      otlp_grpc/gateway:
        endpoint: otel-gateway-collector:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: 2000
        retry_on_failure:
          enabled: true

    service:
      extensions:
        - health_check
        - file_storage
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8s_attributes, memory_limiter, batch]
          exporters: [otlp_grpc/gateway]
