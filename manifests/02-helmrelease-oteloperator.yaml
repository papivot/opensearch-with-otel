apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-operator
  namespace: observability
spec:
  interval: 30m
  timeout: 15m
  releaseName: otel-operator
  targetNamespace: observability
  storageNamespace: observability
  chart:
    spec:
      chart: opentelemetry-operator
      version: "0.123.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  driftDetection:
    mode: enabled
  values:
    # Explicit even though it's already the chart default: RBAC for the collectors'
    # ServiceAccounts is hand-written in manifests/03 and 04, not auto-inferred.
    manager:
      createRbacPermissions: false
    admissionWebhooks:
      certManager:
        enabled: false
      autoGenerateCert:
        enabled: true
